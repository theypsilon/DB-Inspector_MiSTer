<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MiSTer Custom Database Inspector</title>
    <meta
      name="description"
      content="Inspect MiSTer custom downloader databases and archive summaries in the browser."
    />
    <script>
      // The theme, before the page draws: the visitor's choice, else their system's. The same rule
      // as src/lib/theme.js, which the page's toggle uses from then on.
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('inspector-theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
